<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Details</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/welcome.css">
</head>
<body style="background: #f7faff;">
    <div class="navbar">
        <div class="navbar-logo"><a href="/" style="color:#2d6cdf;text-decoration:none;">SOHAN HOTEL</a></div>
    </div>
    <main style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;">
        <div style="max-width:900px;width:100%;margin:0 auto;padding:48px 48px 40px 48px;background:rgba(255,255,255,0.98);border-radius:20px;box-shadow:0 2px 24px rgba(0,0,0,0.10);">
            <h2 style="color:green;text-align:center;margin-bottom:24px;font-size:2rem;">CONFIRMED</h2>
            <div style="display:flex;align-items:center;gap:32px;justify-content:center;margin-bottom:24px;">
                <img th:src="@{'/images/' + ${reservation.room.type.name().toLowerCase()} + '.jpg'}" alt="Room Image" style="width:120px;height:90px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.10);" />
                <div style="font-size:1.2rem;">
                    <div style="font-weight:600;font-size:1.25rem;">Room <span th:text="${reservation.room.roomNumber}"></span></div>
                    <div>Type: <span th:text="${reservation.room.type}"></span></div>
                    <div>Price: $<span th:text="${reservation.totalPrice()}"></span></div>
                    <div>Check-in: <span th:text="${checkInDate}"></span></div>
                    <div>Check-out: <span th:text="${checkOutDate}"></span></div>
                </div>
            </div>
            <div style="max-width:500px;margin:0 auto;">
                <div style="margin-bottom:12px;font-size:1.08rem;"><strong>Booking ID:</strong> <span th:text="${reservation.bookingId}"></span></div>
                <div style="margin-bottom:12px;font-size:1.08rem;"><strong>Name:</strong> <span th:text="${reservation.user.name}"></span></div>
                <div style="margin-bottom:12px;font-size:1.08rem;"><strong>Email:</strong> <span th:text="${reservation.user.email}"></span></div>
                <div style="margin-bottom:12px;font-size:1.08rem;"><strong>Phone:</strong> <span th:text="${reservation.user.phone}"></span></div>
                <div style="margin-bottom:12px;font-size:1.08rem;"><strong>Check-in:</strong> <span th:text="${reservation.checkInDate}"></span></div>
                <div style="margin-bottom:12px;font-size:1.08rem;"><strong>Check-out:</strong> <span th:text="${reservation.checkOutDate}"></span></div>
                <form th:action="@{/}" method="get" style="margin-top:18px;">
                    <button type="submit" style="width:100%;background:linear-gradient(90deg,#2d6cdf 60%,#38a169 100%);color:#fff;font-size:1.08rem;font-weight:600;padding:12px 0;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-top:8px;">Book Another Room</button>
                </form>
                <button type="button" onclick="window.print()" style="width:100%;background:#2d6cdf;color:#fff;font-size:1.08rem;font-weight:600;padding:12px 0;border-radius:8px;box-shadow:0 2px 8px rgba(45,108,223,0.08);margin-top:8px;">Print / Download PDF</button>
            </div>
        </div>
    </main>
</body>
</html>
